:katello:
  :rest_client_timeout: <%= ENV.fetch('REST_CLIENT_TIMEOUT') { 3600 } %>

  :event_daemon:
    :enabled: <%= ENV.fetch('KATELLO_EVENTS') { 'false' } %>

  :candlepin:
    :url: https://<%= ENV.fetch('CANDLEPIN_HOST') { 'localhost' } %>/candlepin
    :oauth_key: <%= ENV.fetch('CANDLEPIN_OAUTH_KEY') { File.read('/etc/foreman/oauth_key') } %>
    :oauth_secret: <%= ENV.fetch('CANDLEPIN_OAUTH_SECRET') { File.read('/etc/foreman/oauth_secret') } %>
    :ca_cert_file: /etc/foreman/tls/ca.crt

  :candlepin_events:
    :broker_host: <%= ENV.fetch('CANDLEPIN_EVENT_BROKER') { 'localhost' } %>
    :ssl_cert_file: /etc/foreman/tls/tls.crt
    :ssl_key_file: /etc/foreman/tls/tls.key
    :ssl_ca_file: /etc/foreman/tls/ca.crt

  :agent:
    :enabled: false