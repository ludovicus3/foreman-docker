---
:katello:
  :rest_client_timeout: <%= ENV.fetch('REST_CLIENT_TIMEOUT') { 3600 } %>

  :event_daemon:
    :enabled: <%= ENV.fetch('KATELLO_EVENTS') { 'false' } %>

  :candlepin:
    :url: https://<%= CANDLEPIN_HOST %>:<%= CANDLEPIN_PORT %>/candlepin
    :oauth_key: <%= CANDLEPIN_OAUTH_KEY %>
    :oauth_secret: <%= CANDLEPIN_OAUTH_SECRET %>
    :ca_cert_file: /etc/foreman/tls/ca.crt
  
  :candlepin_events:
    :broker_host: <%= ENV['CANDLEPIN_BROKER_HOST'] %>
    :broker_port: <%= ENV.fetch('CANDLEPIN_BROKER_PORT') { 61613 } %>
    :ssl_cert_file: /etc/foreman/tls/tls.crt
    :ssl_key_file: /etc/foreman/tls/tls.key
    :ssl_ca_file: /etc/foreman/tls/ca.crt