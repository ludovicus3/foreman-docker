name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  push:
    branches: [ "develop"]
    # Publish semver tags as releases.
  pull_request:
    branches: [ "develop" ]

env:
  REGISTRY: quay.io
  IMAGE_NAME:  ${{ vars.QUAY_LOGIN }}/foreman

jobs:
  foreman:
    strategy:
      matrix:
        include:
          - foreman_version: 3.1-stable
            plugins: |
              gem 'katello', '~> 4.3.0'
              gem 'foreman-tasks', '~> 5.2.3'
              gem 'foreman_webhooks', '~>2.0.3'
              gem 'foreman_virt_who_configure', '>= 0.5.9', '< 0.5.14'
              gem 'foreman_templates', '~> 9.1.0'
              gem 'foreman_remote_execution', '~> 5.0.7'
              gem 'foreman_puppet', '~> 2.0.6'
              gem 'foreman_patch', '~> 1.1.3'
              gem 'foreman_ansible', '~> 7.0.4'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Workaround: https://github.com/docker/build-push-action/issues/461
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v2.5.0

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.QUAY_LOGIN }}
          password: ${{ secrets.QUAY_PASSWORD }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v4.3.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            ${{ matrix.foreman_version }}

      - name: Configure Plugins
        run:
          - echo ${{ matrix.plugins }} > bundler.d/plugins.rb

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v4.0.0
        with:
          context: foreman
          build-args: |
            FOREMAN_VERSION=${{ matrix.foreman_version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

